name: Demo site

# GitHub Pages carries the demo build of the application at the root and the
# written record beneath it at /docs. The demo is a static export whose API
# client answers in the browser; see apps/web/src/demo/backend.ts for what it
# computes and what it replays.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  NEXT_PUBLIC_DEMO: '1'
  NEXT_PUBLIC_BASE_PATH: /ledger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build the demo export
        # Through turbo, so the workspace packages the web app imports —
        # @acct/domain above all — are built first.
        run: pnpm exec turbo run build --filter=@acct/web

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r apps/web/out/. site/
          node scripts/build-docs-site.mjs
          # Pages runs Jekyll by default, which drops directories starting with
          # an underscore — including Next's _next asset directory.
          touch site/.nojekyll

      # The deploy is gated on the demo actually working: if posting an entry
      # no longer moves the trial balance, nothing gets published.
      - name: Verify the demo
        run: |
          # The demo is built for the /ledger sub-path, so it is served from one
          # to match how Pages will serve it.
          mkdir -p verify
          cp -r site verify/ledger
          npx --yes serve verify -l 4173 &
          npx --yes wait-on -t 60000 http://localhost:4173/ledger/
          pnpm --filter @acct/web exec playwright install --with-deps chromium
          E2E_BASE_URL=http://localhost:4173/ledger/ pnpm --filter @acct/web test:e2e:demo

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
