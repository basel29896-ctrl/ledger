name: accounting

# Source is bind-mounted for hot reload, but every node_modules directory is a
# container-owned volume: the host installs Windows/macOS binaries that a Linux
# container cannot execute, and pnpm's symlinks point into the host store.
x-workspace-volumes: &workspace-volumes
  - .:/repo
  - /repo/node_modules
  - /repo/apps/api/node_modules
  - /repo/apps/web/node_modules
  - /repo/packages/shared/node_modules
  - /repo/packages/domain/node_modules
  - /repo/packages/db/node_modules

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:latest
    ports: ["1025:1025", "8025:8025"]

  pgweb:
    image: sosedoff/pgweb:latest
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    ports: ["8081:8081"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile, target: dev }
    env_file: [.env]
    environment:
      # Restricted role for the app; owner role for migrations only.
      DATABASE_URL: postgresql://acct_app_user:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailhog
    ports: ["${API_PORT:-4000}:4000"]
    volumes: *workspace-volumes
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, target: dev }
    env_file: [.env]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
    ports: ["${WEB_PORT:-3000}:3000"]
    volumes: *workspace-volumes
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
