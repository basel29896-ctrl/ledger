name: accounting-test

# Ephemeral stack for CI. tmpfs storage: a test run never survives itself.
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: accounting_test
    ports: ["55432:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    volumes:
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d accounting_test"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis-test:
    image: redis:7-alpine
    ports: ["56379:6379"]
